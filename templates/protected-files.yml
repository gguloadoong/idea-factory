# protected-files.yml — idea-factory v8 item 3.4
# 에이전트가 이 파일들을 변경하면 architect 에스컬레이션 트리거
#
# trigger_on:
#   any_change (기본값) — 아무 변경이나 flag
#   function_signature_change — 함수 시그니처 변경만
#   constant_change — 상수값 변경만
#   deletion — 삭제만 감지

files:
  - file: "src/**/*engine*.{js,ts}"
    reason: "시그널/코어 엔진, 크라운 주얼"
    trigger_on: any_change
    reviewer: architect

  - file: "src/**/*auth*.{js,ts}"
    reason: "인증/보안 관련 코드"
    trigger_on: any_change
    reviewer: security-reviewer

  - file: "*.config.{js,ts,json}"
    reason: "프로젝트 설정 파일"
    trigger_on: any_change
    reviewer: architect

  - file: ".github/workflows/*.yml"
    reason: "CI/CD 파이프라인"
    trigger_on: any_change
    reviewer: architect

  - file: "package.json"
    reason: "의존성 관리"
    trigger_on: any_change
    reviewer: code-reviewer
