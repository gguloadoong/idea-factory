hooks:
  - changed-files:
      - any-glob-to-any-file: 'templates/hooks/**'

scripts:
  - changed-files:
      - any-glob-to-any-file: 'scripts/**'

templates:
  - changed-files:
      - any-glob-to-any-file:
          - 'templates/**'
          - '!templates/hooks/**'

tests:
  - changed-files:
      - any-glob-to-any-file: 'tests/**'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - '.github/**'

config:
  - changed-files:
      - any-glob-to-any-file:
          - '*.json'
          - '*.yml'
          - '*.yaml'
